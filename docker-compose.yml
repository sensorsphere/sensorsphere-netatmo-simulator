services:
  netatmo-simulator:
    build: .
    image: sensorsphere-netatmo-simulator:0.2.0-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8091}:8091"
      - "${TAILSCALE_BIND_ADDRESS:-100.64.0.8}:${WEB_PORT:-8091}:8091"
    environment:
      PORT: "8091"
      SIM_ADMIN_TOKEN: "${SIM_ADMIN_TOKEN:-}"
